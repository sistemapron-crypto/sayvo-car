<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seed Firebase – SAYVO Catalogo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; color: #f0c040; }
    p  { font-size: .9rem; color: #aaa; margin-bottom: 24px; text-align: center; max-width: 480px; }
    #btn { padding: 14px 36px; background: #f0c040; color: #000; font-size: 1rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: opacity .2s; }
    #btn:disabled { opacity: .45; cursor: not-allowed; }
    #log  { margin-top: 24px; width: 100%; max-width: 540px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; font-size: .8rem; font-family: monospace; max-height: 360px; overflow-y: auto; }
    .ok   { color: #4caf50; }
    .err  { color: #f44336; }
    .info { color: #90caf9; }
  </style>
</head>
<body>

<h1>🔥Seed de Produtos – SAYVO Catalogo</h1>
<p>Clique no botão abaixo para enviar todos os produtos, categorias e cupons ao Firestore do Firebase. Execute <strong>apenas uma vez</strong>. Se rodar novamente, usará <code>set</code> com o mesmo ID (não duplica).</p>

<button id="btn">🚀 Enviar Produtos ao Firebase</button>

<div id="log"><span class="info">Aguardando…</span></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
//Preencher com as credenciais do Firebase.
const firebaseConfig = {
  apiKey: "AIzaSyBJFrMrZ7XdBpn1jJqtPz1eC2IKvcQYrrc",
  authDomain: "catalogo-modelo-3ba73.firebaseapp.com",
  projectId: "catalogo-modelo-3ba73",
  storageBucket: "catalogo-modelo-3ba73.firebasestorage.app",
  messagingSenderId: "380760744772",
  appId: "1:380760744772:web:c992400bdbcf840845ad11"
};

const produtos = [
  { id: 1, nome: "Batom",                                          categoria: "maquiagens", preco: 49.00,  imagem: "./assets/batom.jpg",                descricao: "Batom Cremoso Vermelho" },
  { id: 2, nome: "Kit Mini Batom + Mini Blush",                     categoria: "maquiagens", preco: 90.00,  imagem: "./assets/kit-batom blush.webp",     descricao: "Kit Mini Batom Líquido Nude Matte + Mini Blush" },
  { id: 3, nome: "Kit Skin Care Facial e Efeito Peeling",           categoria: "skincare",   preco: 50.00,  imagem: "./assets/skin Care1.webp",          descricao: "Kit Skin Care Anti Manchas Clareador Facial e Efeito Peeling" },
  { id: 4, nome: "Kit Skin care Vitamina C",                        categoria: "skincare",   preco: 120.00, imagem: "./assets/skin-care2.webp",          descricao: "Kit Skin care Vitamina C Anti-idade Clareador Facial" },
  { id: 5, nome: "Pincel Para Pó Facial",                           categoria: "acessórios", preco: 32.99,  imagem: "./assets/pincel1.webp",             descricao: "Pincel Para Pó Facial" },
  { id: 6, nome: "Bolsa Organizadora De Acessórios Para Maquiagem", categoria: "acessórios", preco: 49.99,  imagem: "./assets/bolsa-maquiagem.jpeg",     descricao: "Bolsa Organizadora De Acessórios Para Maquiagem" },
];

const categorias = [
  { id: "all",        nome: "Todos",       icone: "fa-border-all" },
  { id: "maquiagens", nome: "Maquiagens",  icone: "fa-wand-magic-sparkles" },
  { id: "skincare",   nome: "Skin care",   icone: "fa-spa" },
  { id: "acessórios", nome: "Acessórios",  icone: "fa-gem" },
];

const cupons = [
  { codigo: "DESCONTO10", tipo: "percentual", valor: 10, valorMinimo: 0, validade: null, ativo: true },
];

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const log = document.getElementById("log");
const btn = document.getElementById("btn");

async function autenticarAdmin() {
  const email = prompt("Digite o e-mail do administrador:");
  const senha = prompt("Digite a senha do administrador:");

  if (!email || !senha) {
    throw new Error("Login cancelado.");
  }

  await firebase.auth().signInWithEmailAndPassword(email, senha);
}

const addLog = (msg, tipo = "ok") => {
  const span = document.createElement("span");
  span.className = tipo;
  span.textContent = msg;
  log.appendChild(span);
  log.appendChild(document.createElement("br"));
  log.scrollTop = log.scrollHeight;
};

btn.addEventListener("click", async () => {
  btn.disabled = true;
  log.innerHTML = "";

  try {
    addLog("🔐 Autenticando administrador...", "info");

    await autenticarAdmin();

    addLog("✔ Administrador autenticado.", "ok");
    addLog("▶ Iniciando envio...", "info");

    let ok = 0, erros = 0;

    for (const p of produtos) {
      try {
        await db.collection("produtos").doc(String(p.id)).set({
          ...p,
          ativo: true,
          destaque: false,
          criadoEm: firebase.firestore.FieldValue.serverTimestamp()
        });
        addLog(`✔ [${p.id}] ${p.nome}`, "ok");
        ok++;
      } catch (e) {
        addLog(`✘ [${p.id}] ${p.nome} — ${e.message}`, "err");
        erros++;
      }
    }

    addLog("", "info");
    addLog("▶ Enviando categorias...", "info");

    for (const c of categorias) {
      try {
        await db.collection("categorias").doc(c.id).set(c);
        addLog(`✔ Categoria: ${c.nome}`, "ok");
      } catch (e) {
        addLog(`✘ Categoria: ${c.nome} — ${e.message}`, "err");
        erros++;
      }
    }

    addLog("", "info");
    addLog("▶ Enviando cupons...", "info");

    for (const c of cupons) {
      try {
        await db.collection("cupons").doc(c.codigo).set(c);
        addLog(`✔ Cupom: ${c.codigo}`, "ok");
      } catch (e) {
        addLog(`✘ Cupom: ${c.codigo} — ${e.message}`, "err");
        erros++;
      }
    }

    addLog("", "info");
    addLog(
      `━━━ CONCLUÍDO: ${ok} produtos enviados, ${erros} erros ━━━`,
      erros > 0 ? "err" : "info"
    );

  } catch (e) {
    addLog(`✘ Erro de autenticação: ${e.message}`, "err");
  }

  btn.disabled = false;
});
</script>
</body>
</html>
