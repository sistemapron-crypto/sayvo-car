    async function autenticarAdmin() {

      const email = prompt("Digite o e-mail do administrador:");
      const senha = prompt("Digite a senha do administrador:");

      if (!email || !senha) {
        throw new Error("Login cancelado.");
      }

      await firebase.auth().signInWithEmailAndPassword(
        email,
        senha
      );
    }

      span.textContent = msg;

      log.appendChild(span);
      log.appendChild(document.createElement("br"));

      log.scrollTop = log.scrollHeight;
    };

        addLog(
          "🚗 PRIME MOTORS — DEMONSTRAÇÃO",
          "info"
        );

        addLog(
          `✔ ${veiculosOk} veículos cadastrados`,
          "ok"
        );

        addLog(
          `✔ ${marcasOk} marcas cadastradas`,
          "ok"
        );

        addLog(
          `✔ ${categoriasOk} categorias cadastradas`,
          "ok"
        );

        addLog(
          `✔ ${cuponsOk} cupom cadastrado`,
          "ok"
        );

        addLog(
          `⚠ ${totalErros} erro(s)`,
          totalErros > 0 ? "err" : "ok"
        );

        addLog(
          "════════════════════════════════════",
          "info"
        );

        addLog(
          "🚀 Seed concluído!",
          totalErros > 0 ? "err" : "ok"
        );

      } catch (e) {

        addLog(
          `✘ Erro: ${e.message}`,
          "err"
        );

      }

      btn.disabled = false;

    });

  </script>
